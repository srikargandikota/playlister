version: "3.9"

services:
  db:
    image: postgres:16
    container_name: music_tagger_db
    environment:
      POSTGRES_USER: music_tagger_user
      POSTGRES_PASSWORD: music_tagger_password
      POSTGRES_DB: music_tagger
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

